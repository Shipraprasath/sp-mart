# ===================================================================
# SP-Mart Test Configuration (Isolated In-Memory Database)
# ===================================================================

spring.application.name=SP-Mart-Test
spring.datasource.url=jdbc:h2:mem:spmart_testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.h2.console.enabled=false

spmart.merchant.upi-id=test.spmart@upi
spmart.shipping.free-threshold=500.00
spmart.shipping.flat-rate=50.00
