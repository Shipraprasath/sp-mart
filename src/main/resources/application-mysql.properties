# ===================================================================
# SP MART — Production / MySQL 8 Profile Configuration
# Activate via: --spring.profiles.active=mysql or SPRING_PROFILES_ACTIVE=mysql
# ===================================================================

# --- MySQL Datasource Configuration ---
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:spmartdb}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Kolkata&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}

# --- HikariCP Connection Pooling ---
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=SPMartHikariPool

# --- JPA / Hibernate Configuration for MySQL 8+ ---
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# --- Disable H2 Console in Production Profile ---
spring.h2.console.enabled=false

# --- Production Logging ---
logging.level.root=INFO
logging.level.com.spmart=INFO
logging.level.org.springframework.security=WARN
