# ===================================================================
# SP-Mart — Smart Online Shopping Application Configuration
# ===================================================================

spring.application.name=SP-Mart
server.port=${PORT:8080}

# --- Database & Datasource (H2 Persistent Storage) ---
spring.datasource.url=jdbc:h2:file:./data/spmartdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate Configuration ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# --- H2 Web Console (Restricted to Development) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# --- Thymeleaf Template Engine ---
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# --- Multipart File Upload Settings ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Logging Configuration ---
logging.level.root=INFO
logging.level.com.spmart=DEBUG
logging.level.org.springframework.security=INFO

# --- SP-Mart Business Rules & Payment Defaults ---
spmart.merchant.upi-id=spmart.pay@okaxis
spmart.shipping.free-threshold=500.00
spmart.shipping.flat-rate=50.00

# --- SP-Mart AI Shopping Assistant Config (Configurable Backend Service) ---
spmart.ai.api-key=${SPMART_AI_API_KEY:}
spmart.ai.model=${SPMART_AI_MODEL:gemini-1.5-flash}

