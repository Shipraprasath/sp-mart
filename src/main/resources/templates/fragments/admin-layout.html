<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="admin-head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? title + ' | SP MART Administration' : 'Admin Console | SP MART'}">Admin Console | SP MART</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
</head>
<body>

<div class="saas-sidebar" th:fragment="sidebar(activeTab)">
    <div style="margin-bottom: 2rem;">
        <a th:href="@{/admin/dashboard}" class="brand-logo brand-logo-light">
            <div class="brand-icon-box">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
            </div>
            <span>SP <span class="brand-accent-text" style="color: var(--cyan-highlight);">MART</span></span>
            <span class="badge badge-cyan" style="font-size: 0.65rem; margin-left: 0.35rem;">ADMIN</span>
        </a>
    </div>

    <ul class="saas-nav-list">
        <li>
            <a th:href="@{/admin/dashboard}" class="saas-nav-link" th:classappend="${activeTab == 'dashboard' ? 'active' : ''}">
                <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    <span>Dashboard</span>
                </div>
            </a>
        </li>

        <li>
            <a th:href="@{/admin/sellers}" class="saas-nav-link" th:classappend="${activeTab == 'sellers' ? 'active' : ''}">
                <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                    <span>Manage Sellers</span>
                </div>
            </a>
        </li>

        <li>
            <a th:href="@{/admin/products}" class="saas-nav-link" th:classappend="${activeTab == 'products' ? 'active' : ''}">
                <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
                    <span>Products</span>
                </div>
            </a>
        </li>

        <li>
            <a th:href="@{/admin/categories}" class="saas-nav-link" th:classappend="${activeTab == 'categories' ? 'active' : ''}">
                <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                    <span>Categories</span>
                </div>
            </a>
        </li>

        <li>
            <a th:href="@{/admin/inventory}" class="saas-nav-link" th:classappend="${activeTab == 'inventory' ? 'active' : ''}">
                <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
                    <span>Stock & Inventory</span>
                </div>
            </a>
        </li>

        <li>
            <a th:href="@{/admin/orders}" class="saas-nav-link" th:classappend="${activeTab == 'orders' ? 'active' : ''}">
                <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                    <span>Orders</span>
                </div>
            </a>
        </li>

        <li>
            <a th:href="@{/admin/customers}" class="saas-nav-link" th:classappend="${activeTab == 'customers' ? 'active' : ''}">
                <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
                    <span>Buyers</span>
                </div>
            </a>
        </li>

        <li>
            <a th:href="@{/admin/reviews}" class="saas-nav-link" th:classappend="${activeTab == 'reviews' ? 'active' : ''}">
                <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                    <span>Review Moderation</span>
                </div>
            </a>
        </li>
    </ul>

    <div style="margin-top: auto; padding-top: 1.5rem; border-top: 1px solid rgba(255, 255, 255, 0.1);">
        <a th:href="@{/}" class="saas-nav-link" style="margin-bottom: 0.5rem;">
            <span>← Return to Storefront</span>
        </a>
        <a th:href="@{/logout}" class="btn btn-outline-white btn-sm btn-block">Sign Out</a>
    </div>
</div>

</body>
</html>
