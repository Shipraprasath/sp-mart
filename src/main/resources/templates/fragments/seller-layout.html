<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? title + ' | Seller Portal | SP MART' : 'Seller Portal | SP MART'}">Seller Portal | SP MART</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
</head>
<body>

<div th:fragment="sidebar(activeTab)" class="saas-sidebar">
    <a th:href="@{/}" class="brand-logo brand-logo-light" style="margin-bottom: 2rem;">
        <div class="brand-icon-box">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        </div>
        <span>SP <span class="brand-accent-text" style="color: var(--cyan-highlight);">MART</span></span>
    </a>

    <div style="background-color: rgba(255, 255, 255, 0.06); padding: 0.85rem; border-radius: var(--radius-md); margin-bottom: 1.5rem;">
        <span style="font-size: 0.7rem; color: #94A3B8; text-transform: uppercase; letter-spacing: 0.05em; display: block;">SELLER STORE</span>
        <strong style="color: #FFFFFF; font-size: 0.95rem; display: block;" th:text="${profile != null ? profile.storeName : 'Apex Tech'}">Apex Tech</strong>
        <span class="badge badge-success" style="font-size: 0.65rem; margin-top: 0.35rem;">✓ Verified Seller</span>
    </div>

    <ul class="saas-nav-list">
        <li>
            <a th:href="@{/seller/dashboard}" class="saas-nav-link" th:classappend="${activeTab == 'dashboard' ? 'active' : ''}">
                <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    <span>Dashboard</span>
                </div>
            </a>
        </li>
        <li>
            <a th:href="@{/seller/products}" class="saas-nav-link" th:classappend="${activeTab == 'products' ? 'active' : ''}">
                <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
                    <span>My Products</span>
                </div>
            </a>
        </li>
        <li>
            <a th:href="@{/seller/products/new}" class="saas-nav-link" th:classappend="${activeTab == 'new-product' ? 'active' : ''}">
                <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                    <span>Add New Product</span>
                </div>
            </a>
        </li>
        <li>
            <a th:href="@{/seller/orders}" class="saas-nav-link" th:classappend="${activeTab == 'orders' ? 'active' : ''}">
                <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                    <span>Customer Orders</span>
                </div>
            </a>
        </li>
        <li>
            <a th:href="@{/seller/reports}" class="saas-nav-link" th:classappend="${activeTab == 'reports' ? 'active' : ''}">
                <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                    <span>Sales & Reports</span>
                </div>
            </a>
        </li>
    </ul>

    <div style="margin-top: auto; padding-top: 1.5rem; border-top: 1px solid rgba(255, 255, 255, 0.1);">
        <a th:href="@{/}" class="saas-nav-link" style="margin-bottom: 0.5rem;">
            <span>← Back to Storefront</span>
        </a>
        <a th:href="@{/logout}" class="btn btn-outline-white btn-sm btn-block">Logout</a>
    </div>
</div>

</body>
</html>
