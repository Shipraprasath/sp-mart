<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Set New Password')}"></head>
<body>

<div th:replace="~{fragments/layout :: announcement-bar}"></div>
<header th:replace="~{fragments/layout :: header}"></header>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="main-content">
    <div class="container" style="max-width: 500px; padding-top: 3rem;">
        <div class="card-box">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h1 style="font-size: 1.6rem; color: var(--midnight-navy); margin-bottom: 0.5rem;">Create New Password</h1>
                <p style="color: var(--secondary-text); font-size: 0.9rem;">
                    Your reset token has been verified. Enter your new secure password below.
                </p>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                <span th:text="${errorMessage}">Error message</span>
            </div>

            <form th:action="@{/reset-password}" method="post">
                <input type="hidden" name="token" th:value="${token}">

                <div class="form-group">
                    <label class="form-label" for="newPassword">New Password</label>
                    <input type="password" id="newPassword" name="newPassword" class="form-control" placeholder="Min. 6 characters" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirm New Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Repeat new password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-bottom: 1.25rem;">
                    Update Password & Sign In
                </button>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
