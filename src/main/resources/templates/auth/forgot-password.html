<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Forgot Password')}"></head>
<body>

<div th:replace="~{fragments/layout :: announcement-bar}"></div>
<header th:replace="~{fragments/layout :: header}"></header>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="main-content">
    <div class="container" style="max-width: 500px; padding-top: 3rem;">
        <div class="card-box">
            <div style="text-align: center; margin-bottom: 2rem;">
                <div class="brand-icon-box" style="margin: 0 auto 1rem auto;">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                </div>
                <h1 style="font-size: 1.6rem; color: var(--midnight-navy); margin-bottom: 0.5rem;">Reset Your Password</h1>
                <p style="color: var(--secondary-text); font-size: 0.9rem;">
                    Enter the email address associated with your SP MART account. We will generate a secure reset link.
                </p>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                <span th:text="${errorMessage}">Error message</span>
            </div>

            <form th:action="@{/forgot-password}" method="post">
                <div class="form-group">
                    <label class="form-label" for="email">Account Email</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-bottom: 1.25rem;">
                    Generate Reset Link
                </button>
            </form>

            <div style="text-align: center; font-size: 0.9rem; color: var(--secondary-text);">
                Remember your password? <a th:href="@{/login}" style="color: var(--electric-blue); font-weight: 600;">Back to Sign In</a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
